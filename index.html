    <!-- Canonical per public page. The SPA serves this same file on every URL, so a
         static canonical would point /join, /qr, /terms to the home page. It is set
         here from the path instead, and only for public pages. -->
    <script>
      (function () {
        var p = location.pathname.replace(/\/+$/, '') || '/';
        if (!/^\/(join|qr|terms|stores\/[^/]+)?$/.test(p)) return;
        var l = document.createElement('link');
        l.rel = 'canonical';
        l.href = 'https://delivr-ten.vercel.app' + (p === '/' ? '/' : p);
        document.head.appendChild(l);
      })();
    </script>
